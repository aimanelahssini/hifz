<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-label="The quran command lists the 114 surahs with their numbers; typing 56 opens Al-Wâqi'a in the corner, and the terminal can be closed."><title>The quran command lists the 114 surahs with their numbers; typing 56 opens Al-Wâqi'a in the corner, and the terminal can be closed.</title>
<defs>
  <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#1e2a4a"/>
    <stop offset="0.55" stop-color="#284b63"/>
    <stop offset="1" stop-color="#3b6e6a"/>
  </linearGradient>
  <radialGradient id="glow" cx="0.78" cy="0.18" r="0.6">
    <stop offset="0" stop-color="#f6d98b" stop-opacity="0.22"/>
    <stop offset="1" stop-color="#f6d98b" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f6d98b"/>
    <stop offset="1" stop-color="#d9a441"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
    <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
  </filter>
  <filter id="blur" x="-5%" y="-20%" width="110%" height="140%">
    <feGaussianBlur stdDeviation="5"/>
  </filter>
  <style>
    text { font-family: Inter, 'Adwaita Sans', Cantarell, 'Segoe UI', system-ui, sans-serif; }
    .mono { font-family: 'Adwaita Mono', 'JetBrains Mono', 'DejaVu Sans Mono', monospace; }
  </style>
</defs>
<rect width="1200" height="470" rx="22" fill="url(#wall)"/><g transform="translate(60,50)" filter="url(#shadow)"><rect width="720" height="370" rx="12" fill="#1d1d22"/><path d="M0 12a12 12 0 0 1 12-12h696a12 12 0 0 1 12 12v28H0z" fill="#2a2a30"/><text x="360.0" y="25" font-size="13" font-weight="700" fill="#fff" fill-opacity="0.85" text-anchor="middle">Terminal</text></g><text x="82" y="116" font-size="13" font-weight="700" fill="#e8e8ec" fill-opacity="1" text-anchor="start" class="mono" xml:space="preserve">$ quran</text><text x="82" y="158" font-size="13" font-weight="400" fill="#e8e8ec" fill-opacity="0.85" text-anchor="start" class="mono" xml:space="preserve">  1  Al-Fâtiha           39  Az-Zoumar           77  Al-Moursalât    </text><text x="82" y="179" font-size="13" font-weight="400" fill="#e8e8ec" fill-opacity="0.85" text-anchor="start" class="mono" xml:space="preserve">  2  Al-Baqara           40  Ghâfir              78  An-Naba'        </text><text x="82" y="200" font-size="13" font-weight="400" fill="#e8e8ec" fill-opacity="0.85" text-anchor="start" class="mono" xml:space="preserve">  3  Âl 'Imrân           41  Foussilat           79  An-Nâzi'ât      </text><text x="82" y="221" font-size="13" font-weight="400" fill="#e8e8ec" fill-opacity="0.85" text-anchor="start" class="mono" xml:space="preserve">  4  An-Nisâ'            42  Ach-Choûrâ          80  'Abasa          </text><text x="82" y="263" font-size="13" font-weight="400" fill="#e8e8ec" fill-opacity="0.5" text-anchor="start" class="mono" xml:space="preserve">  ⋮</text><text x="82" y="284" font-size="13" font-weight="400" fill="#e8e8ec" fill-opacity="0.85" text-anchor="start" class="mono" xml:space="preserve"> 55  Ar-Rahmân</text><text x="82" y="305" font-size="13" font-weight="700" fill="#7ee2a8" fill-opacity="1" text-anchor="start" class="mono" xml:space="preserve"> 56  Al-Wâqi'a  ✓3</text><text x="82" y="326" font-size="13" font-weight="400" fill="#e8e8ec" fill-opacity="0.85" text-anchor="start" class="mono" xml:space="preserve"> 57  Al-Hadîd</text><text x="82" y="359" font-size="13" font-weight="400" fill="#e8e8ec" fill-opacity="1" text-anchor="start" class="mono" xml:space="preserve">Surah number (Enter = 56 Al-Wâqi'a): 56</text><text x="82" y="380" font-size="13" font-weight="400" fill="#e8e8ec" fill-opacity="0.7" text-anchor="start" class="mono" xml:space="preserve">Opening Al-Wâqi'a. You can close this terminal.</text><g transform="translate(720,40) scale(0.82)"><rect width="440" height="212" rx="18" fill="#101014" fill-opacity="0.80" filter="url(#shadow)"/><rect x="0.5" y="0.5" width="439" height="211" rx="17.5" fill="none" stroke="#fff" stroke-opacity="0.10"/><clipPath id="clip72040"><rect x="0" y="36" width="440" height="176"/></clipPath><text x="16" y="19.5" font-size="11" font-weight="600" fill="#fff" fill-opacity="0.74" text-anchor="start">Al-Wâqi'a</text><text x="83.6" y="19.5" font-size="11" font-weight="400" fill="#fff" fill-opacity="0.5" text-anchor="start">·  Bismillah</text><g transform="translate(374,12.5)" fill="#fff" fill-opacity="0.45" stroke="#fff" stroke-opacity="0.45"><path d="M0 4.5h3l4-3.5v12l-4-3.5H0z" stroke="none"/><path d="M9.5 4.5l4 4m0-4l-4 4" fill="none" stroke-width="1.5" stroke-linecap="round"/></g><rect x="394" y="11" width="34" height="17" rx="8.5" fill="#ffffff" fill-opacity="0.08"/><path d="M401 19.8l2.6 2.6 4.6-5" fill="none" stroke="#ffffff" stroke-opacity="0.62" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="419" y="23.6" font-size="11" font-weight="700" fill="#ffffff" fill-opacity="0.62" text-anchor="end">3</text><g clip-path="url(#clip72040)"><text x="18" y="66" font-size="19" font-weight="500" fill="#fff" fill-opacity="1" text-anchor="start">Bismi-llâhi-r-rahmâni-r-rahîm</text><text x="18" y="101" font-size="19" font-weight="500" fill="#fff" fill-opacity="0.56" text-anchor="start">Idhâ waqa'ati-l-wâqi'ah</text><text x="18" y="136" font-size="19" font-weight="500" fill="#fff" fill-opacity="0.44" text-anchor="start">Laysa liwaq'atihâ kâdhibah</text><text x="18" y="171" font-size="19" font-weight="500" fill="#fff" fill-opacity="0.33" text-anchor="start">Khâfidatour-râfi'ah</text><text x="18" y="206" font-size="19" font-weight="500" fill="#fff" fill-opacity="0.24" text-anchor="start">Idhâ roujjati-l-ardou rajjâ</text><text x="18" y="241" font-size="19" font-weight="500" fill="#fff" fill-opacity="0.24" text-anchor="start">Waboussati-l-jibâlou bassâ</text></g></g><text x="979.6" y="247.84" font-size="13" font-weight="500" fill="#fff" fill-opacity="0.75" text-anchor="middle">stays open after the terminal closes</text></svg>
