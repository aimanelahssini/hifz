<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="The end-of-surah button with its four choices (again, next surah, previous, random), and the 22:00 notification: Time for Al-Wâqi'a, with a Recite now button."><title>The end-of-surah button with its four choices (again, next surah, previous, random), and the 22:00 notification: Time for Al-Wâqi'a, with a Recite now button.</title>
<defs>
  <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#1e2a4a"/>
    <stop offset="0.55" stop-color="#284b63"/>
    <stop offset="1" stop-color="#3b6e6a"/>
  </linearGradient>
  <radialGradient id="glow" cx="0.78" cy="0.18" r="0.6">
    <stop offset="0" stop-color="#f6d98b" stop-opacity="0.22"/>
    <stop offset="1" stop-color="#f6d98b" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f6d98b"/>
    <stop offset="1" stop-color="#d9a441"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
    <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
  </filter>
  <filter id="blur" x="-5%" y="-20%" width="110%" height="140%">
    <feGaussianBlur stdDeviation="5"/>
  </filter>
  <style>
    text { font-family: Inter, 'Adwaita Sans', Cantarell, 'Segoe UI', system-ui, sans-serif; }
    .mono { font-family: 'Adwaita Mono', 'JetBrains Mono', 'DejaVu Sans Mono', monospace; }
  </style>
</defs>
<rect width="1200" height="420" rx="22" fill="url(#wall)"/><text x="60" y="70" font-size="20" font-weight="700" fill="#fff" fill-opacity="1" text-anchor="start">What comes after a finished surah</text><circle cx="88" cy="128" r="26" fill="#fff" fill-opacity="0.07"/><path transform="translate(88,128) scale(1.9)" d="M-5 -1a5 5 0 0 1 8.5-3.5M5 1a5 5 0 0 1-8.5 3.5M3.5-7.5v3h-3M-3.5 7.5v-3h3" fill="none" stroke="#fff" stroke-opacity="0.7" stroke-width="0.84" stroke-linecap="round" stroke-linejoin="round"/><text x="88" y="180" font-size="13" font-weight="400" fill="#fff" fill-opacity="0.65" text-anchor="middle">Again</text><circle cx="218" cy="128" r="26" fill="#fff" fill-opacity="0.18"/><path transform="translate(218,128) scale(1.9)" d="M-5 0h10M1-4l4 4-4 4" fill="none" stroke="#fff" stroke-opacity="1" stroke-width="0.84" stroke-linecap="round" stroke-linejoin="round"/><text x="218" y="180" font-size="13" font-weight="600" fill="#fff" fill-opacity="0.9" text-anchor="middle">Next surah</text><circle cx="348" cy="128" r="26" fill="#fff" fill-opacity="0.07"/><path transform="translate(348,128) scale(1.9)" d="M5 0h-10M-1-4l-4 4 4 4" fill="none" stroke="#fff" stroke-opacity="0.7" stroke-width="0.84" stroke-linecap="round" stroke-linejoin="round"/><text x="348" y="180" font-size="13" font-weight="400" fill="#fff" fill-opacity="0.65" text-anchor="middle">Previous</text><circle cx="478" cy="128" r="26" fill="#fff" fill-opacity="0.07"/><path transform="translate(478,128) scale(1.9)" d="M-6-4h3l6 8h3M-6 4h3l6-8h3M4-6l2 2-2 2M4 2l2 2-2 2" fill="none" stroke="#fff" stroke-opacity="0.7" stroke-width="0.84" stroke-linecap="round" stroke-linejoin="round"/><text x="478" y="180" font-size="13" font-weight="400" fill="#fff" fill-opacity="0.65" text-anchor="middle">Random</text><text x="60" y="230" font-size="14" font-weight="400" fill="#fff" fill-opacity="0.7" text-anchor="start">One round button in the header: each click picks the next choice.</text><text x="60" y="254" font-size="14" font-weight="400" fill="#fff" fill-opacity="0.7" text-anchor="start">After Yes, nothing plays by itself: it waits on the first line.</text><g transform="translate(660,90)" filter="url(#shadow)"><rect width="480" height="150" rx="16" fill="#2b2b31"/><g transform="translate(18,18) scale(0.34)"><rect x="8" y="8" width="112" height="112" rx="28" fill="#1d2233"/><rect x="28" y="50" width="58" height="11" rx="5.5" fill="#fff"/><rect x="28" y="70" width="72" height="9" rx="4.5" fill="#fff" fill-opacity="0.42"/><circle cx="94" cy="32" r="11" fill="url(#gold)"/></g><text x="70" y="34" font-size="12" font-weight="600" fill="#fff" fill-opacity="0.6" text-anchor="start">Hifz</text><text x="462" y="34" font-size="12" font-weight="400" fill="#fff" fill-opacity="0.5" text-anchor="end">22:00</text><text x="70" y="62" font-size="16" font-weight="700" fill="#fff" fill-opacity="1" text-anchor="start">Time for Al-Wâqi'a</text><text x="70" y="86" font-size="14" font-weight="400" fill="#fff" fill-opacity="0.75" text-anchor="start">Recite Al-Wâqi'a before you sleep.</text><rect x="16" y="104" width="448" height="34" rx="10" fill="#fff" fill-opacity="0.08"/><text x="240.0" y="126" font-size="14" font-weight="600" fill="#fff" fill-opacity="1" text-anchor="middle">Recite now</text></g><text x="660" y="290" font-size="20" font-weight="700" fill="#fff" fill-opacity="1" text-anchor="start">Every evening at 22:00</text><text x="660" y="318" font-size="14" font-weight="400" fill="#fff" fill-opacity="0.7" text-anchor="start">Click it and Hifz opens on Al-Wâqi'a, even when it's closed.</text><text x="660" y="342" font-size="14" font-weight="400" fill="#fff" fill-opacity="0.7" text-anchor="start">Right-click the card to turn it off.</text></svg>
