<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-label="At the last ayah a question appears over the blurred text: Finished Al-Wâqi'a? Then 57 Al-Hadîd. Yes counts it and opens Al-Hadîd, waiting on its first line."><title>At the last ayah a question appears over the blurred text: Finished Al-Wâqi'a? Then 57 Al-Hadîd. Yes counts it and opens Al-Hadîd, waiting on its first line.</title>
<defs>
  <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#1e2a4a"/>
    <stop offset="0.55" stop-color="#284b63"/>
    <stop offset="1" stop-color="#3b6e6a"/>
  </linearGradient>
  <radialGradient id="glow" cx="0.78" cy="0.18" r="0.6">
    <stop offset="0" stop-color="#f6d98b" stop-opacity="0.22"/>
    <stop offset="1" stop-color="#f6d98b" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#f6d98b"/>
    <stop offset="1" stop-color="#d9a441"/>
  </linearGradient>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
    <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
  </filter>
  <filter id="blur" x="-5%" y="-20%" width="110%" height="140%">
    <feGaussianBlur stdDeviation="5"/>
  </filter>
  <style>
    text { font-family: Inter, 'Adwaita Sans', Cantarell, 'Segoe UI', system-ui, sans-serif; }
    .mono { font-family: 'Adwaita Mono', 'JetBrains Mono', 'DejaVu Sans Mono', monospace; }
  </style>
</defs>
<rect width="1200" height="330" rx="22" fill="url(#wall)"/><g transform="translate(40,58) scale(1.0)"><rect width="440" height="212" rx="18" fill="#101014" fill-opacity="0.80" filter="url(#shadow)"/><rect x="0.5" y="0.5" width="439" height="211" rx="17.5" fill="none" stroke="#fff" stroke-opacity="0.10"/><clipPath id="clip4058"><rect x="0" y="36" width="440" height="176"/></clipPath><g filter="url(#blur)" opacity="0.55"><text x="16" y="19.5" font-size="11" font-weight="600" fill="#fff" fill-opacity="0.45" text-anchor="start">56</text><text x="35" y="19.5" font-size="11" font-weight="600" fill="#fff" fill-opacity="0.74" text-anchor="start">Al-Wâqi'a</text><path d="M98.6 14.5l3 3 3-3" fill="none" stroke="#fff" stroke-opacity="0.45" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><text x="114.6" y="19.5" font-size="11" font-weight="400" fill="#fff" fill-opacity="0.5" text-anchor="start">·  96 / 96</text><path transform="translate(304,15) scale(1.0)" d="M-5 0h10M1-4l4 4-4 4" fill="none" stroke="#fff" stroke-opacity="0.5" stroke-width="1.60" stroke-linecap="round" stroke-linejoin="round"/><text x="360" y="19.5" font-size="11" font-weight="700" fill="#fff" fill-opacity="0.55" text-anchor="end">1×</text><g transform="translate(374,12.5)" fill="#fff" fill-opacity="0.45" stroke="#fff" stroke-opacity="0.45"><path d="M0 4.5h3l4-3.5v12l-4-3.5H0z" stroke="none"/><path d="M9.5 4.5l4 4m0-4l-4 4" fill="none" stroke-width="1.5" stroke-linecap="round"/></g><rect x="394" y="11" width="34" height="17" rx="8.5" fill="#ffffff" fill-opacity="0.08"/><path d="M401 19.8l2.6 2.6 4.6-5" fill="none" stroke="#ffffff" stroke-opacity="0.62" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="419" y="23.6" font-size="11" font-weight="700" fill="#ffffff" fill-opacity="0.62" text-anchor="end">3</text><g clip-path="url(#clip4058)"><text x="18" y="66" font-size="19" font-weight="700" fill="#fff" fill-opacity="1" text-anchor="start">Fasabbih bismi rabbika-l-'adhîm</text><text x="18" y="97" font-size="14" font-weight="600" font-style="italic" fill="#e9c46a" fill-opacity="0.9">Finished? Press Space or scroll</text></g></g></g><g transform="translate(40,58)"><rect width="440" height="212" rx="18" fill="#0a0a0e" fill-opacity="0.45"/><text x="220.0" y="84" font-size="17" font-weight="600" fill="#fff" fill-opacity="1" text-anchor="middle">Finished Al-Wâqi'a?</text><text x="220.0" y="104" font-size="12" font-weight="400" fill="#fff" fill-opacity="0.6" text-anchor="middle">Finished 3 times so far</text><text x="220.0" y="121" font-size="11" font-weight="400" fill="#e9c46a" fill-opacity="0.9" text-anchor="middle">Then 57 Al-Hadîd</text><rect x="104" y="132" width="92" height="34" rx="17" fill="#fff" fill-opacity="0.12"/><text x="150" y="154" font-size="14" font-weight="600" fill="#fff" fill-opacity="1" text-anchor="middle">Not yet</text><rect x="206" y="132" width="132" height="34" rx="17" fill="#fff"/><text x="272" y="154" font-size="14" font-weight="600" fill="#111114" fill-opacity="1" text-anchor="middle">Yes, I finished</text></g><g transform="translate(720,58) scale(1.0)"><rect width="440" height="212" rx="18" fill="#101014" fill-opacity="0.80" filter="url(#shadow)"/><rect x="0.5" y="0.5" width="439" height="211" rx="17.5" fill="none" stroke="#fff" stroke-opacity="0.10"/><clipPath id="clip72058"><rect x="0" y="36" width="440" height="176"/></clipPath><text x="16" y="19.5" font-size="11" font-weight="600" fill="#fff" fill-opacity="0.45" text-anchor="start">57</text><text x="35" y="19.5" font-size="11" font-weight="600" fill="#fff" fill-opacity="0.74" text-anchor="start">Al-Hadîd</text><path d="M92.2 14.5l3 3 3-3" fill="none" stroke="#fff" stroke-opacity="0.45" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><text x="108.2" y="19.5" font-size="11" font-weight="400" fill="#fff" fill-opacity="0.5" text-anchor="start">·  Bismillah</text><path transform="translate(304,15) scale(1.0)" d="M-5 0h10M1-4l4 4-4 4" fill="none" stroke="#fff" stroke-opacity="0.5" stroke-width="1.60" stroke-linecap="round" stroke-linejoin="round"/><text x="360" y="19.5" font-size="11" font-weight="700" fill="#fff" fill-opacity="0.55" text-anchor="end">1×</text><g transform="translate(374,12.5)" fill="#fff" fill-opacity="0.45" stroke="#fff" stroke-opacity="0.45"><path d="M0 4.5h3l4-3.5v12l-4-3.5H0z" stroke="none"/><path d="M9.5 4.5l4 4m0-4l-4 4" fill="none" stroke-width="1.5" stroke-linecap="round"/></g><rect x="394" y="11" width="34" height="17" rx="8.5" fill="#ffffff" fill-opacity="0.08"/><path d="M401 19.8l2.6 2.6 4.6-5" fill="none" stroke="#ffffff" stroke-opacity="0.34" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><text x="419" y="23.6" font-size="11" font-weight="700" fill="#ffffff" fill-opacity="0.34" text-anchor="end">0</text><g clip-path="url(#clip72058)"><text x="18" y="66" font-size="19" font-weight="700" fill="#fff" fill-opacity="1" text-anchor="start">Bismi-llâhi-r-rahmâni-r-rahîm</text><text x="18" y="101" font-size="19" font-weight="500" fill="#fff" fill-opacity="0.56" text-anchor="start">Sabbaha lillâhi mâ fi-s-samâwâti wa-</text><text x="18" y="124" font-size="19" font-weight="500" fill="#fff" fill-opacity="0.56" text-anchor="start">l-ardi wahouwa-l-'azîzou-l-hakîm</text><text x="18" y="159" font-size="19" font-weight="500" fill="#fff" fill-opacity="0.44" text-anchor="start">Lahoû moulkou-s-samâwâti wa-l-ardi</text><text x="18" y="182" font-size="19" font-weight="500" fill="#fff" fill-opacity="0.44" text-anchor="start">youhyî wayoumîtou wahouwa 'alâ koulli</text><text x="18" y="205" font-size="19" font-weight="500" fill="#fff" fill-opacity="0.44" text-anchor="start">châ'in qadîr</text><text x="18" y="240" font-size="19" font-weight="500" fill="#fff" fill-opacity="0.33" text-anchor="start">Houwa-l-awwalou wa-l-âkhirou wa-dh-</text><text x="18" y="263" font-size="19" font-weight="500" fill="#fff" fill-opacity="0.33" text-anchor="start">dhâhirou wa-l-bâtinou wahouwa</text><text x="18" y="286" font-size="19" font-weight="500" fill="#fff" fill-opacity="0.33" text-anchor="start">bikoulli châ'in 'alîm</text><text x="18" y="321" font-size="19" font-weight="500" fill="#fff" fill-opacity="0.24" text-anchor="start">Houwa-lladhî khalaqa-s-samâwâti wa-l-</text><text x="18" y="344" font-size="19" font-weight="500" fill="#fff" fill-opacity="0.24" text-anchor="start">arda fî sittati ayyâmin thoumma-stawâ</text><text x="18" y="367" font-size="19" font-weight="500" fill="#fff" fill-opacity="0.24" text-anchor="start">'ala-l-'archi ya'lamou mâ yalijou fi-</text><text x="18" y="390" font-size="19" font-weight="500" fill="#fff" fill-opacity="0.24" text-anchor="start">l-ardi wamâ yakhroujou minhâ wamâ</text><text x="18" y="413" font-size="19" font-weight="500" fill="#fff" fill-opacity="0.24" text-anchor="start">yanzilou mina-s-samâ'i wamâ ya'roujou</text><text x="18" y="436" font-size="19" font-weight="500" fill="#fff" fill-opacity="0.24" text-anchor="start">fîhâ wahouwa ma'akoum ayna mâ</text><text x="18" y="459" font-size="19" font-weight="500" fill="#fff" fill-opacity="0.24" text-anchor="start">kountoum wa-llâhou bimâ ta'maloûna</text><text x="18" y="482" font-size="19" font-weight="500" fill="#fff" fill-opacity="0.24" text-anchor="start">basîr</text><text x="18" y="517" font-size="19" font-weight="500" fill="#fff" fill-opacity="0.24" text-anchor="start">Lahoû moulkou-s-samâwâti wa-l-ardi</text><text x="18" y="540" font-size="19" font-weight="500" fill="#fff" fill-opacity="0.24" text-anchor="start">wa'ila-llâhi tourja'ou-l-oumoûr</text></g></g><path d="M512 165h176" stroke="#fff" stroke-opacity="0.6" stroke-width="2" stroke-dasharray="2 7" stroke-linecap="round"/><path d="M680 159l9 6-9 6" fill="none" stroke="#fff" stroke-opacity="0.6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="600" y="150" font-size="13" font-weight="500" fill="#fff" fill-opacity="0.75" text-anchor="middle">Yes, I finished</text><text x="600" y="190" font-size="12" font-weight="400" fill="#fff" fill-opacity="0.55" text-anchor="middle">counted, then the next surah,</text><text x="600" y="208" font-size="12" font-weight="400" fill="#fff" fill-opacity="0.55" text-anchor="middle">waiting on its first line</text></svg>
